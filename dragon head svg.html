<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 Dragon's Breath Glow Studio</title>
    <style>
        /* Hooks into your existing Nocturne CSS variables */
        :root[data-theme="midnight"] {
            --bg-color: #0c0914;
            --dragon-body-color: #171124;
            --fire-core-color: #ffc470;
            --fire-glow-color: rgba(255, 140, 0, 0.45);
            --ui-bg: #130f1c;
            --ui-panel: #1b1528;
            --ui-border: #2d2440;
            --ui-text: #e2e8f0;
            --ui-accent: #ffeb99;
        }
        :root[data-theme="deep-woods"] {
            --bg-color: #06110b;
            --dragon-body-color: #0e2017;
            --fire-core-color: #70ffa0;
            --fire-glow-color: rgba(0, 180, 0, 0.4);
            --ui-bg: #091810;
            --ui-panel: #11241a;
            --ui-border: #1f3d2d;
            --ui-text: #e6fffa;
            --ui-accent: #319795;
        }
        :root[data-theme="twilight-dusk"] {
            --bg-color: #140d1a;
            --dragon-body-color: #21162b;
            --fire-core-color: #fed7e2;
            --fire-glow-color: rgba(237, 100, 166, 0.4);
            --ui-bg: #1b1224;
            --ui-panel: #271b35;
            --ui-border: #3f2b54;
            --ui-text: #fff5f7;
            --ui-accent: #d53f8c;
        }
        :root[data-theme="obsidian-gold"] {
            --bg-color: #0a0a0a;
            --dragon-body-color: #141414;
            --fire-core-color: #fefcbf;
            --fire-glow-color: rgba(236, 201, 75, 0.5);
            --ui-bg: #121212;
            --ui-panel: #1a1a1a;
            --ui-border: #2e2e2e;
            --ui-text: #fffaf0;
            --ui-accent: #d69e2e;
        }
        :root[data-theme="enchanted-violet"] {
            --bg-color: #0f0a1a;
            --dragon-body-color: #19102b;
            --fire-core-color: #e9d8fd;
            --fire-glow-color: rgba(159, 122, 234, 0.45);
            --ui-bg: #160f24;
            --ui-panel: #211736;
            --ui-border: #382857;
            --ui-text: #faf5ff;
            --ui-accent: #805ad5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--ui-bg);
            color: var(--ui-text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Controls */
        aside {
            width: 360px;
            background-color: var(--ui-panel);
            border-right: 1px solid var(--ui-border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--ui-text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #a0aec0;
            display: flex;
            justify-content: space-between;
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        button.theme-btn {
            background-color: var(--ui-bg);
            border: 1px solid var(--ui-border);
            color: var(--ui-text);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            text-align: left;
        }

        button.theme-btn:hover, button.theme-btn.active {
            border-color: var(--ui-accent);
            background-color: rgba(255, 255, 255, 0.03);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--ui-accent);
        }

        .export-btn {
            background-color: var(--ui-accent);
            color: #1a202c;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: auto;
        }

        .export-btn:hover {
            opacity: 0.9;
        }

        /* Preview Canvas */
        main {
            flex: 1;
            position: relative;
            background-color: var(--forest-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .preview-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--ui-panel);
            border: 1px solid var(--ui-border);
            width: 600px;
            max-width: 90%;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal h2 {
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: var(--ui-bg);
            border: 1px solid var(--ui-border);
            color: var(--ui-text);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--ui-border);
            color: var(--ui-text);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <aside>
        <h1>🐉 Dragon's Breath Studio</h1>
        
        <div class="section">
            <label>Theme Preset</label>
            <div class="theme-buttons">
                <button class="theme-btn active" onclick="setTheme('midnight')">Midnight</button>
                <button class="theme-btn" onclick="setTheme('deep-woods')">Deep Woods</button>
                <button class="theme-btn" onclick="setTheme('twilight-dusk')">Twilight Dusk</button>
                <button class="theme-btn" onclick="setTheme('obsidian-gold')">Obsidian Gold</button>
                <button class="theme-btn" onclick="setTheme('enchanted-violet')">Enchanted Violet</button>
            </div>
        </div>

        <div class="section">
            <label>Flame Density / Layers <span id="val-count">10</span></label>
            <input type="range" id="flameLayers" min="4" max="20" value="10" oninput="updatePattern()">
        </div>

        <div class="section">
            <label>Glow Blur Radius <span id="val-blur">20px</span></label>
            <input type="range" id="blurRadius" min="10" max="50" value="20" oninput="updatePattern()">
        </div>

        <div class="section">
            <label>Base Opacity <span id="val-opacity">1.0</span></label>
            <input type="range" id="patternOpacity" min="0.5" max="1" step="0.05" value="1.0" oninput="updatePattern()">
        </div>

        <button class="export-btn" onclick="openExportModal()">Export Code for Agent</button>
    </aside>

    <main id="previewContainer">
        <!-- SVG Pattern injected dynamically via JS -->
    </main>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h2>Export Pattern Code</h2>
            <p style="font-size: 0.85rem; color: #a0aec0;">Copy the CSS background snippet or raw SVG markup below:</p>
            <textarea id="exportCode" readonly></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeExportModal()">Close</button>
                <button class="export-btn" style="margin-top:0;" onclick="copyCode()">Copy to Clipboard</button>
            </div>
        </div>
    </div>

            document.documentElement.setAttribute('data-theme', themeName);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase().replace(' ', '-') === themeName);
            });
        }

        // Pseudo-random generator for consistent pattern tiling

            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
